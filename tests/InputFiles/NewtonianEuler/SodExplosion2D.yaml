# Executable: EvolveNewtonianEulerRiemannProblem1D
# Check: parse;execute

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.0001
  TimeStepper:
    RungeKutta4

PhaseChangeAndTriggers:

DomainCreator:
  Rectangle:
    LowerBound: [-1.0, -1.0]
    UpperBound: [1.0, 1.0]
    InitialRefinement: [6, 6]
    InitialGridPoints: [3, 3]
    TimeDependence: None
    BoundaryCondition:
      DirichletAnalytic

SpatialDiscretization:
  BoundaryCorrection:
    Hll:
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: Gauss

AnalyticData:
  SodExplosion:
    InitialRadius: 0.5
    InnerMassDensity: 1.0
    InnerPressure: 1.0
    OuterMassDensity: 0.125
    OuterPressure: 0.1

Limiter:
  NewtonianEulerMinmod:
    Type: LambdaPiN
    VariablesToLimit: Characteristic
    # The optimal value of the TVB constant is problem-dependent.
    # This test uses 0 to favor robustness over accuracy.
    TvbConstant: 0.0
    ApplyFlattener: true
    DisableForDebugging: false

EventsAndTriggers:
  ? Slabs:
      EvenlySpaced:
        Interval: 1
        Offset: 0
  : - ObserveFields:
        SubfileName: VolumeData
        VariablesToObserve: [MassDensity]
        InterpolateToMesh: None
        CoordinatesFloatingPointType: Double
        FloatingPointTypes: [Double]
  ? Slabs:
      Specified:
        Values: [4]
  : - Completion

EventsAndDenseTriggers:

Observers:
  VolumeFileName: "SodExplosion2DVolume"
  ReductionFileName: "SodExplosion2DReductions"
