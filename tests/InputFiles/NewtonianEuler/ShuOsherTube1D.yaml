# Executable: EvolveNewtonianEulerRiemannProblem1D
# Check: parse;execute

ResourceInfo:
  AvoidGlobalProc0: false

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.001
  TimeStepper: RungeKutta4

PhaseChangeAndTriggers:

DomainCreator:
  Interval:
    LowerBound: [-5]
    UpperBound: [5]
    InitialRefinement: [5]
    InitialGridPoints: [6]
    TimeDependence: None
    BoundaryConditions:
      LowerBoundary: DirichletAnalytic
      UpperBoundary: DirichletAnalytic

SpatialDiscretization:
  BoundaryCorrection:
    Hll:
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Subcell:
      InitialData:
        RdmpDelta0: 1.0e-4
        RdmpEpsilon: 1.0e-3
        PerssonExponent: 4.0
      RdmpDelta0: 1.0e-4
      RdmpEpsilon: 1.0e-3
      PerssonExponent: 4.0
      AlwaysUseSubcells: false
      SubcellToDgReconstructionMethod: DimByDim
  SubcellSolver:
    Reconstructor:
      # Wcns5zPrim:
      #   NonlinearWeightExponent: 2
      #   Epsilon: 1.0e-15
      #   LowOrderReconstructionToFallback: None
      #   MaxNumberOfExtrema: 1
      Mp5Prim:
        Alpha: 4.0
        Epsilon: 0.0e-10

AnalyticData:
  ShuOsherTube:
    JumpPosition: -4.0
    LeftMassDensity: 3.86
    LeftVelocity: 2.63
    LeftPressure: 10.3
    RightVelocity: 0.0
    RightPressure: 1.0
    Epsilon: 0.2
    Lambda: 5.0

EventsAndTriggers:
  ? Slabs:
      Specified:
        Values: [1800]
  : - Completion
  # ? Slabs:
  #     EvenlySpaced:
  #       Interval: 300
  #       Offset: 0
  # : - ObserveTimeStep:
  #       SubfileName: time_steps
  #       PrintTimeToTerminal: true
  #       ObservePerCore: false
  ? Slabs:
      # EvenlySpaced:
      #   Interval: 50
      #   Offset: 1000
      Specified:
        Values: [1800]
  : - ObserveFields:
        SubfileName: VolumeData
        VariablesToObserve: [MassDensity]
        InterpolateToMesh: None
        CoordinatesFloatingPointType: Double
        FloatingPointTypes: [Double]

EventsAndDenseTriggers:

Observers:
  VolumeFileName: "ShuOsher1DMp5_A4_E1m00"
  ReductionFileName: "ShuOsherTube1DReductions"
