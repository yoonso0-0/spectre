Executable: EvolveForceFree
Testing:
  Check: parse;execute

---

InitialData: &InitialData
  ExactWald:
    MagneticFieldAmplitude : 1.0

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.0005
  TimeStepper:
    Rk3PareschiSsp4
    # Rk3Kennedy
  ImexMode: Implicit
  ImexImplicitSolveTolerance: 1.0e-10
  # TimeStepper: Rk3HesthavenSsp

Observers:
  VolumeFileName: "ForceFreeWaldSolutionLev5Volume"
  ReductionFileName: "ForceFreeWaldSolutionLev5Reductions"
  SurfaceFileName: "ForceFreeSurfaceData"

EvolutionSystem:
  ForceFree:
    ConstraintDamping:
      KappaPsi: 1.0
      KappaPhi: 1.0
      KappaBoundary: 0.0
    ForceFreeCurrent:
      ParallelConductivity: 0.0

# Filtering:
  # ExpFilter0:
  #   Alpha: 36.0
  #   HalfPower: 24
  #   Enable: false
  #   BlocksToFilter: All

# DomainCreator:
  # Brick:
  #   LowerBound: [3, 3, 3]
  #   UpperBound: [-3, -3, -3]
  #   InitialRefinement: [3, 3, 3]
  #   InitialGridPoints: [4, 4, 4]
  #   TimeDependence: None
  #   BoundaryConditionInX: &Analytic
  #     DirichletAnalytic:
  #       AnalyticPrescription: *InitialData
  #   BoundaryConditionInY: *Analytic
  #   BoundaryConditionInZ: *Analytic

DomainCreator:
  Sphere:
    InnerRadius: 1.7
    OuterRadius: 4
    Interior:
      ExciseWithBoundaryCondition:
        # DirichletAnalytic:
        #   AnalyticPrescription: *InitialData
        DemandOutgoingCharSpeeds
    InitialRefinement:
      Shell0: [0, 0, 0]
    InitialGridPoints: 5
    UseEquiangularMap: false
    EquatorialCompression: None
    RadialPartitioning: []
    RadialDistribution: Linear
    WhichWedges: All
    TimeDependentMaps: None
    OuterBoundaryCondition:
      DirichletAnalytic:
        AnalyticPrescription: *InitialData

SpatialDiscretization:
  BoundaryCorrection:
    Rusanov:
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Subcell:
      RdmpDelta0: 1.0e-0
      RdmpEpsilon: 1.0e-0
      PerssonExponent: 4.0
      InitialData:
        RdmpDelta0: 1.0e-7
        RdmpEpsilon: 1.0e-3
        PerssonExponent: 3.0
      AlwaysUseSubcells: false
      SubcellToDgReconstructionMethod: DimByDim
      UseHalo: false
      OnlyDgBlocksAndGroups: [Shell0]
      FiniteDifferenceDerivativeOrder: 2
    TciOptions:
      TildeQCutoff: DoNotCheckTildeQ
  SubcellSolver:
    Reconstructor:
      # MonotonisedCentral
      Wcns5z:
        NonlinearWeightExponent: 2
        Epsilon: 1e-15
        FallbackReconstructor: None
        MaxNumberOfExtrema: 2

EventsAndTriggers:
  - Trigger:
      TimeCompares:
        Comparison: GreaterThanOrEqualTo
        Value: 0.4
    Events:
      - Completion
  # - Trigger:
      # Slabs:
        # Specified:
          # Values: [1]
    # Events:
      # - Completion
  - Trigger:
      Slabs:
        Specified:
          Values: [0]
    Events:
      - ChangeSlabSize:
          DelayChange: 0
          StepChoosers:
            - Cfl:
                SafetyFactor: 0.3
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 2
          Offset: 0
    Events:
      - ObserveTimeStep:
          SubfileName: time_steps
          PrintTimeToTerminal: true
          ObservePerCore: false
  # - Trigger:
  #     Slabs:
  #       EvenlySpaced:
  #         Interval: 1
  #         Offset: 0
  #   Events:
  #     # - MagneticFluxThroughSphere
  #     # - PoyntingFluxOnSphere
  #     # - ObserveFields:
  #     #     SubfileName: VolumeData
  #     #     VariablesToObserve: [
  #     #         # ElectricField, MagneticField,
  #     #         TildeE, TildeB,
  #     #         Error(TildeE), Error(TildeB),
  #     #         ChargeDensity,
  #     #         TildePhi, TildePsi,
  #     #         # SpatialCurrentDensity,
  #     #         ElectricFieldDotMagneticField,
  #     #         # NsInteriorSpatialVelocity,
  #     #         # TciStatus,
  #     #         # NsInteriorMask,
  #     #         Lapse, Shift,
  #     #       ]
  #     #     InterpolateToMesh: None
  #     #     CoordinatesFloatingPointType: Float
  #     #     FloatingPointTypes: [Float]
  #     - ObserveNorms:
  #         SubfileName: ErrorNorm
  #         TensorsToObserve:
  #           # - Name: TildeE
  #           #   NormType: L2Norm
  #           #   Components: Sum
  #           - Name: Error(TildeE)
  #             NormType: L2Norm
  #             Components: Sum
  #           - Name: Error(TildeB)
  #             NormType: L2Norm
  #             Components: Sum
  #           - Name: ElectricFieldDotMagneticField
  #             NormType: L2Norm
  #             Components: Sum

EventsAndDenseTriggers:
  - Trigger:
      Times:
        Specified:
          Values: [0.1, 0.2, 0.3]
    Events:
      - ObserveFields:
          SubfileName: VolumeData
          VariablesToObserve: [
            ElectricField,
            MagneticField,
            Error(TildeE),
            Error(TildeB),
            ElectricFieldDotMagneticField,
            # TciStatus
            ]
          InterpolateToMesh: None
          CoordinatesFloatingPointType: Float
          FloatingPointTypes: [Float]
      - ObserveNorms:
          SubfileName: ErrorNorm
          TensorsToObserve:
            # - Name: TildeE
            #   NormType: L2Norm
            #   Components: Sum
            - Name: Error(TildeE)
              NormType: L2Norm
              Components: Sum
            - Name: Error(TildeB)
              NormType: L2Norm
              Components: Sum
            - Name: ElectricFieldDotMagneticField
              NormType: L2Norm
              Components: Sum

InterpolationTargets:
  TotalMagneticFluxOnUpperHemisphere:
    LMax: 30
    Radius: 2.0
    Center: [0, 0, 0]
    AngularOrdering: Strahlkorper
  PoyntingFluxOnSphere:
    LMax: 50
    Radius: 2.0
    Center: [0, 0, 0]
    AngularOrdering: Strahlkorper
  TotalPoyntingFluxOnSphere:
    LMax: 50
    Radius: 1.1
    Center: [0, 0, 0]
    AngularOrdering: Strahlkorper

PhaseChangeAndTriggers:

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto

