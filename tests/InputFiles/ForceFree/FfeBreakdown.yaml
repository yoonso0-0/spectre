Executable: EvolveForceFree
Testing:
  Check: parse;execute

---

Parallelization:
  ElementDistribution: NumGridPoints

InitialData: &InitialData
  FfeBreakdown

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.0122991
  TimeStepper:
    Rk3PareschiSsp4
  Imex:
    Mode: Implicit
    SolveTolerance: 1.0e-10

Observers:
  VolumeFileName: "ForceFreeFfeBreakdownLev5Volume"
  ReductionFileName: "ForceFreeFfeBreakdownLev5Reductions"
  SurfaceFileName: "Surface"

EvolutionSystem:
  ForceFree:
    ConstraintDamping:
      KappaPsi: 100.0
      KappaPhi: 1.0
    ForceFreeCurrent:
      ParallelConductivity: 1e3

DomainCreator:
  Brick:
    LowerBound: [-0.5, -0.1, -0.1]
    UpperBound: [0.5, 0.1, 0.1]
    InitialRefinement: [6, 0, 0]
    InitialGridPoints: [3, 3, 3]
    TimeDependence: None
    BoundaryConditionInX: # NoIncomingPoynting
      DirichletAnalytic:
        AnalyticPrescription: *InitialData
    BoundaryConditionInY: Periodic
    BoundaryConditionInZ: Periodic

SpatialDiscretization:
  BoundaryCorrection:
    Rusanov:
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Subcell:
      RdmpDelta0: 1.0e-2
      RdmpEpsilon: 1.0e-2
      PerssonExponent: 4.0
      InitialData:
        RdmpDelta0: 1.0e-2
        RdmpEpsilon: 1.0e-2
        PerssonExponent: 3.0
      AlwaysUseSubcells: false
      SubcellToDgReconstructionMethod: DimByDim
      UseHalo: false
      OnlyDgBlocksAndGroups: []
      FiniteDifferenceDerivativeOrder: 2
    TciOptions:
      TildeQCutoff: DoNotCheckTildeQ
      AlphaMagE: DoNotCheckTildeE
      AlphaMagB: 4.0
      DeltaAlpha: 1.0
      NumberOfHighestModes: 1
      UseUmaxInsteadOfNorm: false
  SubcellSolver:
    Reconstructor:
      # MonotonisedCentral
      Wcns5z:
        NonlinearWeightExponent: 2
        Epsilon: 1e-15
        FallbackReconstructor: None
        MaxNumberOfExtrema: 2

EventsAndTriggers:
  - Trigger:
      TimeCompares:
        Comparison: GreaterThanOrEqualTo
        Value: 0.04
    Events:
      - Completion
  # - Trigger:
      # Slabs:
        # Specified:
          # Values: [50]
    # Events:
      # - Completion
  - Trigger:
      Slabs:
        Specified:
          Values: [0]
    Events:
      - ChangeSlabSize:
          DelayChange: 0
          StepChoosers:
            - Cfl:
                SafetyFactor: 0.3
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 10
          Offset: 0
    Events:
      - ObserveTimeStep:
          SubfileName: time_steps
          PrintTimeToTerminal: true
          ObservePerCore: false
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 2
          Offset: 0
    Events:
      - ObserveFields:
          SubfileName: VolumeData
          VariablesToObserve: [
              ElectricField, MagneticField,
              ChargeDensity,
              ElectricCurrentDensity,
              # TildeJ,
              TildePsi, TildePhi,
              ElectricFieldDotMagneticField,
              MagneticDominanceViolation,
              JouleHeating,
              TciStatus,
            ]
          InterpolateToMesh: None
          CoordinatesFloatingPointType: Float
          FloatingPointTypes: [Float]

Filtering:
  ExpFilter0:
    Alpha: 12
    HalfPower: 32
    Enable: false
    BlocksToFilter: All

EventsAndDenseTriggers:
  # - Trigger:
  #     Times:
  #       Specified:
  #         Values: [0.0, 0.01, 0.02, 0.03, 0.04]
  #   Events:
  #     - ObserveFields:
  #         SubfileName: VolumeData
  #         VariablesToObserve: [
  #           ElectricField,
  #           MagneticField,
  #           # ChargeDensity,
  #           # SpatialCurrentDensity,
  #           # TildeQ, Error(TildeQ),
  #           # SpatialCurrentDensity,
  #           # MagneticDivergenceCleaningField,
  #           # ElectricDivergenceCleaningField,
  #           ElectricFieldDotMagneticField
  #           ]
  #         InterpolateToMesh: None
  #         CoordinatesFloatingPointType: Float
  #         FloatingPointTypes: [Float]
  #         OverrideObservationValue: None

PhaseChangeAndTriggers:

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto

InterpolationTargets:
  TotalMagneticFluxOnUpperHemisphere:
    LMax: 3
    Radius: 2.0
    Center: [0, 0, 0]
    AngularOrdering: Strahlkorper
  PoyntingFluxOnSphere:
    LMax: 3
    Radius: 2.0
    Center: [0, 0, 0]
    AngularOrdering: Strahlkorper
