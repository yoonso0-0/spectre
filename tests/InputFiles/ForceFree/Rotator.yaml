Executable: EvolveForceFree
Testing:
  Check: parse;execute

---
Parallelization:
  ElementDistribution: NumGridPoints

InitialData: &InitialData
  RotatingDipole:
    VectorPotentialAmplitude: 1.0
    Varpi0 : 1.0
    Delta: 0.1
    AngularVelocity : 0.0
    TiltAngle: 0.7

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.0122991
  TimeStepper:
    Rk3PareschiSsp4
  Imex:
    Mode: Implicit
    SolveTolerance: 1.0e-10

Observers:
  VolumeFileName: "ForceFreeRotatorLev5Volume"
  ReductionFileName: "ForceFreeRotatorLev5Reductions"
  SurfaceFileName: "Surface"

EvolutionSystem:
  ForceFree:
    ConstraintDamping:
      KappaPsi: 1.0
      KappaPhi: 1.0
    ForceFreeCurrent:
      ParallelConductivity: 1e2

# DomainCreator:
#   Brick:
#     # LowerBound: [0, -0.125, -2]
#     # UpperBound: [2, 0.125, 2]
#     # InitialRefinement: [3, 0, 4]
#     LowerBound: [-3, -3, -3]
