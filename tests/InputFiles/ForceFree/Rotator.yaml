InterpolationTargets:
  TotalMagneticFluxOnUpperHemisphere:
    LMax: 30
    Radius: 2.0
    Center: [0, 0, 0]
    AngularOrdering: Strahlkorper
  PoyntingFluxOnSphere:
    LMax: 50
    Radius: 2.0
    Center: [0, 0, 0]
    AngularOrdering: Strahlkorper

PhaseChangeAndTriggers:

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto

Filtering:
  ExpFilter0:
    Alpha: 1.0
    HalfPower: 1
    Enable: false
    BlocksToFilter: All
