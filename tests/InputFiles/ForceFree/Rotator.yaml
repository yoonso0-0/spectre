InterpolationTargets:
  TotalMagneticFluxOnSphere:
    LMax: 30
    Radius: 2.0
    Center: [0, 0, 0]
    AngularOrdering: Strahlkorper
  PoyntingFluxOnSphere:
    LMax: 50
    Radius: 2.0
    Center: [0, 0, 0]
    AngularOrdering: Strahlkorper
  TotalPoyntingFluxOnSphere:
    LMax: 50
    Radius: 1.1
    Center: [0, 0, 0]
    AngularOrdering: Strahlkorper

PhaseChangeAndTriggers:

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto
