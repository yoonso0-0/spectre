Executable: EvolveForceFree
Testing:
  Check: parse;execute

---

InitialData: &InitialData
  RotatingDipole:
    VectorPotentialAmplitude: 1.0
    Varpi0 : 1.0
    Delta: 0.1
    AngularVelocity : 0.1
    TiltAngle: 0.0

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.0005
  TimeStepper:
    Rk3PareschiSsp4
    # Rk3Kennedy
  ImexMode: Implicit
  ImexImplicitSolveTolerance: 1.0e-10
  # TimeStepper: Rk3HesthavenSsp

Observers:
  VolumeFileName: "ForceFreeRotatorLev5Volume"
  ReductionFileName: "ForceFreeRotatorLev5Reductions"
  SurfaceFileName: "Surface"

EvolutionSystem:
  ForceFree:
    ConstraintDamping:
      KappaPsi: 1.0
      KappaPhi: 1.0
    ForceFreeCurrent:
      ParallelConductivity: 1e2

DomainCreator:
  Brick:
    # LowerBound: [0, -0.125, -2]
    # UpperBound: [2, 0.125, 2]
    # InitialRefinement: [3, 0, 4]
    LowerBound: [-2, -2, -2]
    UpperBound: [2, 2, 2]
    # LowerBound: [-3.4, -3.4, -3.4]
    # UpperBound: [3.4, 3.4, 3.4]
    InitialRefinement: [2, 2, 2]
    InitialGridPoints: [4, 4, 4]
    TimeDependence: None
    BoundaryConditionInX: &Analytic
      DirichletAnalytic:
        AnalyticPrescription: *InitialData
    BoundaryConditionInY: *Analytic
    BoundaryConditionInZ: *Analytic

# DomainCreator:
#   Sphere:
#     InnerRadius: 0.7
#     OuterRadius: 3.0
#     Interior:
#       FillWithSphericity: 0.0
#     InitialRefinement:
#       InnerCube: [2, 2, 2]
#       Shell0 : [2, 2, 2]
#       # Shell1 : [1]
