#     BoundaryConditionInX: NoIncomingPoynting
#     BoundaryConditionInY: NoIncomingPoynting
#     BoundaryConditionInZ: NoIncomingPoynting

DomainCreator:
  Sphere:
    InnerRadius: 0.5
    OuterRadius: 2.0
    Interior:
      FillWithSphericity: 0.9
    InitialRefinement:
      InnerCube: [1, 1, 1]
      Shell0 : [1, 1, 1]
      # Shell1 : [1]
    InitialGridPoints: 6
    UseEquiangularMap: true
    EquatorialCompression: None
    RadialPartitioning: []
    RadialDistribution: [Linear]
    WhichWedges: All
    TimeDependentMaps: None
    OuterBoundaryCondition:
      DirichletAnalytic:
        AnalyticPrescription: *InitialData

SpatialDiscretization:
  BoundaryCorrection:
    Rusanov:
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Subcell:
      PerssonTci:
        Exponent: 4.0
        NumHighestModes: 1
      RdmpDelta0: 1.0e0
      RdmpEpsilon: 1.0e0
      AlwaysUseSubcells: false
      SubcellToDgReconstructionMethod: DimByDim
      UseHalo: false
      OnlyDgBlocksAndGroups: []
      FiniteDifferenceDerivativeOrder: 4
    TciOptions:
      TildeQCutoff: DoNotCheckTildeQ
      AlphaMagE: DoNotCheckTildeE
      AlphaMagB: 3.0
      DeltaAlpha: 1.0
      UseUmaxInsteadOfNorm: false
  SubcellSolver:
    Reconstructor:
      # MonotonisedCentral
      Wcns5z:
        NonlinearWeightExponent: 2
        Epsilon: 1e-15
        FallbackReconstructor: None
        MaxNumberOfExtrema: 2

EventsAndTriggers:
  # - Trigger:
  #     TimeCompares:
  #       Comparison: GreaterThanOrEqualTo
  #       Value: 0.06
  #   Events:
  #     - Completion
  - Trigger:
      Slabs:
        Specified:
          Values: [0]
    Events:
      - Completion
  - Trigger:
      Slabs:
        Specified:
          Values: [0]
    Events:
      - ChangeSlabSize:
          DelayChange: 0
          StepChoosers:
            - Cfl:
                SafetyFactor: 0.2
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 10
          Offset: 0
    Events:
      - ObserveTimeStep:
          SubfileName: time_steps
          PrintTimeToTerminal: true
          ObservePerCore: false
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 1
          Offset: 0
    Events:
      # - TotalMagneticFluxOnSphere
      # - PoyntingFluxOnSphere
      - ObserveFields:
          SubfileName: VolumeData
          VariablesToObserve: [
              ElectricField, MagneticField,
              ChargeDensity,
              # TildeJ,
              ElectricCurrentDensity,
              ElectricFieldDotMagneticField,
              # NsInteriorSpatialVelocity,
              TciStatus,
            ]
          InterpolateToMesh: None
          CoordinatesFloatingPointType: Float
          FloatingPointTypes: [Float]
  # - Trigger:
