#     UseEquiangularMap: true
#     EquatorialCompression: None
#     RadialPartitioning: []
#     RadialDistribution: [Linear]
#     WhichWedges: All
#     TimeDependentMaps: None
#     OuterBoundaryCondition:
#       DirichletAnalytic:
#         AnalyticPrescription: *InitialData

SpatialDiscretization:
  BoundaryCorrection:
    Rusanov:
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Subcell:
      RdmpDelta0: 1.0e-1
      RdmpEpsilon: 1.0e-1
      PerssonExponent: 2.0
      InitialData:
        RdmpDelta0: 1.0e-7
        RdmpEpsilon: 1.0e-3
        PerssonExponent: 3.0
      AlwaysUseSubcells: false
      SubcellToDgReconstructionMethod: DimByDim
      UseHalo: false
      OnlyDgBlocksAndGroups: None
      FiniteDifferenceDerivativeOrder: 2
    TciOptions:
      TildeQCutoff: DoNotCheckTildeQ
  SubcellSolver:
    Reconstructor:
      # MonotonisedCentral
      Wcns5z:
        NonlinearWeightExponent: 2
        Epsilon: 1e-15
        FallbackReconstructor: None
        MaxNumberOfExtrema: 2

EventsAndTriggers:
  # - Trigger:
  #     TimeCompares:
  #       Comparison: GreaterThanOrEqualTo
  #       Value: 0.06
  #   Events:
  #     - Completion
  - Trigger:
      Slabs:
        Specified:
          Values: [5]
    Events:
      - Completion
  - Trigger:
      Slabs:
        Specified:
          Values: [0]
    Events:
      - ChangeSlabSize:
          DelayChange: 0
          StepChoosers:
            - Cfl:
                SafetyFactor: 0.2
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 10
          Offset: 0
    Events:
      - ObserveTimeStep:
          SubfileName: time_steps
          PrintTimeToTerminal: true
          ObservePerCore: false
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 1
          Offset: 0
    Events:
      - TotalMagneticFluxOnSphere
      - TotalPoyntingFluxOnSphere
      - ObserveFields:
          SubfileName: VolumeData
          VariablesToObserve: [
              ElectricField, MagneticField,
              ChargeDensity,
              # TildeJ,
              ElectricCurrentDensity,
              ElectricFieldDotMagneticField,
              # NsInteriorSpatialVelocity,
              TciStatus,
            ]
          InterpolateToMesh: None
          CoordinatesFloatingPointType: Float
          FloatingPointTypes: [Float]
  # - Trigger:
      # Slabs:
        # EvenlySpaced:
          # Interval: 1
          # Offset: 0
    # Events:
      # - ObserveNorms:
          # SubfileName: ErrorNorm
