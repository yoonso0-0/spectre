Executable: EvolveForceFree
Testing:
  Check: parse;execute

---

InitialData: &InitialData
  MagnetosphericWald:
    Spin: 0.0

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.0005
  TimeStepper:
    Rk3PareschiSsp4
  ImexMode: Implicit
  ImexImplicitSolveTolerance: 1.0e-10

Observers:
  VolumeFileName: "ForceFreeWaldSolutionLev5Volume"
  ReductionFileName: "ForceFreeWaldSolutionLev5Reductions"
  SurfaceFileName: "Surface"

EvolutionSystem:
  ForceFree:
    ConstraintDamping:
      KappaPsi: 1.0
      KappaPhi: 1.0
      KappaBoundary: 1.0
    ForceFreeCurrent:
      ParallelConductivity: 10.0

# DomainCreator:
#   AlignedLattice:
#     BlockBounds: [
#       [-10, -1, -0.5, 0.5, 1, 10],
#       [-10, -1, -0.5, 0.5, 1, 10],
#       [-10, -1, -0.5, 0.5, 1, 10],
#       ]
#     InitialLevels: [1, 1, 1]
#     InitialGridPoints: [2, 2, 2]
#     RefinedLevels: []
#     RefinedGridPoints: []
#     BlocksToExclude: []
#     BoundaryCondition:
#       DirichletAnalytic:
#         AnalyticPrescription: *InitialData

DomainCreator:
  Sphere:
    InnerRadius: 1.0
    OuterRadius: 4.0
    Interior:
      ExciseWithBoundaryCondition:
        DemandOutgoingCharSpeeds
        # Nonreflecting
    InitialRefinement: 2
    InitialGridPoints: 4
    UseEquiangularMap: false
    EquatorialCompression: None
    RadialPartitioning: []
    RadialDistribution: Linear
    WhichWedges: All
    TimeDependentMaps: None
    OuterBoundaryCondition: NoIncomingPoynting
      # DirichletAnalytic:
        # AnalyticPrescription: *InitialData

SpatialDiscretization:
  BoundaryCorrection:
    Rusanov:
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Subcell:
      RdmpDelta0: 1.0e-0
      RdmpEpsilon: 1.0e-0
      PerssonExponent: 3.0
      InitialData:
        RdmpDelta0: 1.0e-7
        RdmpEpsilon: 1.0e-3
        PerssonExponent: 3.0
      AlwaysUseSubcells: false
      SubcellToDgReconstructionMethod: DimByDim
      UseHalo: false
      OnlyDgBlocksAndGroups: []
      FiniteDifferenceDerivativeOrder: 2
    TciOptions:
      TildeQCutoff: DoNotCheckTildeQ
  SubcellSolver:
    Reconstructor:
      MonotonisedCentral
      # Wcns5z:
      #   NonlinearWeightExponent: 2
      #   Epsilon: 1e-15
      #   FallbackReconstructor: None
      #   MaxNumberOfExtrema: 2

EventsAndTriggers:
  # - Trigger:
  #     TimeCompares:
  #       Comparison: GreaterThanOrEqualTo
  #       Value: 0.06
  #   Events:
  #     - Completion
  - Trigger:
      Slabs:
        Specified:
          Values: [30]
    Events:
      - Completion
  - Trigger:
      Slabs:
        Specified:
          Values: [0]
    Events:
      - ChangeSlabSize:
          DelayChange: 0
          StepChoosers:
            - Cfl:
                SafetyFactor: 0.3
  # - Trigger:
  #     Slabs:
  #       EvenlySpaced:
  #         Interval: 10
  #         Offset: 0
  #   Events:
  #     - ObserveTimeStep:
  #         SubfileName: time_steps
  #         PrintTimeToTerminal: true
  #         ObservePerCore: false
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 5
          Offset: 0
    Events:
      - ObserveFields:
          SubfileName: VolumeData
          VariablesToObserve: [
              ElectricField, MagneticField,
              # TildeE, TildeB,
              ChargeDensity,
              ElectricCurrentDensity,
              # TildePhi, TildePsi,
              # TildeQ,
              # SpatialCurrentDensity,
              ElectricFieldDotMagneticField,
              # NsInteriorSpatialVelocity,
              # TciStatus,
              # NsInteriorMask,
              # Lapse, Shift,
            ]
          InterpolateToMesh: None
          CoordinatesFloatingPointType: Float
          FloatingPointTypes: [Float]

EventsAndDenseTriggers:
  # - Trigger:
  #     Times:
  #       Specified:
  #         Values: [0.0, 0.01, 0.02, 0.03, 0.04]
  #   Events:
  #     - ObserveFields:
  #         SubfileName: VolumeData
  #         VariablesToObserve: [
  #           ElectricField,
  #           MagneticField,
  #           # ChargeDensity,
  #           # SpatialCurrentDensity,
  #           # TildeQ, Error(TildeQ),
  #           # SpatialCurrentDensity,
  #           # MagneticDivergenceCleaningField,
  #           # ElectricDivergenceCleaningField,
  #           ElectricFieldDotMagneticField
  #           ]
  #         InterpolateToMesh: None
  #         CoordinatesFloatingPointType: Float
  #         FloatingPointTypes: [Float]
  #         OverrideObservationValue: None

PhaseChangeAndTriggers:

InterpolationTargets:
  TotalMagneticFluxOnUpperHemisphere:
    LMax: 30
    Radius: 2.0
    Center: [0, 0, 0]
    AngularOrdering: Strahlkorper
  PoyntingFluxOnSphere:
    LMax: 50
    Radius: 2.0
    Center: [0, 0, 0]
    AngularOrdering: Strahlkorper
  TotalPoyntingFluxOnSphere:
    LMax: 50
    Radius: 1.1
    Center: [0, 0, 0]
    AngularOrdering: Strahlkorper

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto
