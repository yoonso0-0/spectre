Executable: EvolveForceFree
Testing:
  Check: parse;execute

---

Parallelization:
  ElementDistribution: NumGridPoints

InitialData: &InitialData
  FastWave:

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.005
  MinimumTimeStep: 1e-7
  TimeStepper:
    Rk3PareschiSsp4
  Imex:
    Mode: Implicit
    SolveTolerance: 1.0e-10

Observers:
  VolumeFileName: "ForceFreeFastWaveVolume"
  ReductionFileName: "ForceFreeFastWaveReductions"
  SurfaceFileName: "Surface"

EvolutionSystem:
  ForceFree:
    ConstraintDamping:
      KappaPsi: 0.0
      KappaPhi: 1.0
    ForceFreeCurrent:
      ParallelConductivity: 0.0

DomainCreator:
  Brick:
    LowerBound: [-0.5, -0.1, -0.1]
    UpperBound: [0.5, 0.1, 0.1]
    Distribution: [Linear, Linear, Linear]
    InitialRefinement: [4, 0, 0]
    InitialGridPoints: [4, 4, 4]
    TimeDependence: None
    BoundaryConditions:
      - DirichletAnalytic:
          AnalyticPrescription: *InitialData
      - Periodic
      - Periodic

Filtering:
  ExpFilter0:
    Alpha: 12
    HalfPower: 32
    Enable: false
    BlocksToFilter: All

SpatialDiscretization:
  BoundaryCorrection:
    Rusanov:
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Subcell:
      RdmpDelta0: 1.0e-0
      RdmpEpsilon: 1.0e-0
      PerssonExponent: 4.0
      InitialData:
        RdmpDelta0: 1.0e-2
        RdmpEpsilon: 1.0e-2
        PerssonExponent: 3.0
      AlwaysUseSubcells: false
      SubcellToDgReconstructionMethod: DimByDim
      UseHalo: false
      OnlyDgBlocksAndGroups: [Brick]
      FiniteDifferenceDerivativeOrder: 2
    TciOptions:
      TildeQCutoff: DoNotCheckTildeQ
      AlphaMagE: DoNotCheckTildeE
      AlphaMagB: 4.0
      DeltaAlpha: 1.0
      NumberOfHighestModes: 1
      UseUmaxInsteadOfNorm: false
  SubcellSolver:
    Reconstructor:
      # MonotonisedCentral
      Wcns5z:
        NonlinearWeightExponent: 2
        Epsilon: 1e-15
        FallbackReconstructor: None
        MaxNumberOfExtrema: 2

EventsAndTriggersAtSlabs:
  # - Trigger:
  #     TimeCompares:
  #       Comparison: GreaterThanOrEqualTo
  #       Value: 0.10 # upto t = 0.5
  #   Events:
  #     - Completion
  - Trigger:
      Slabs:
        Specified:
          Values: [400]
    Events:
      - Completion
  - Trigger:
      Slabs:
        Specified:
          Values: [0]
    Events:
      - ChangeSlabSize:
          DelayChange: 0
          StepChoosers:
            - Cfl:
                SafetyFactor: 0.3
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 20
          Offset: 0
    Events:
      - ObserveTimeStep:
          SubfileName: time_steps
          PrintTimeToTerminal: true
          ObservePerCore: false
  # - Trigger:
  #     Slabs:
  #       EvenlySpaced:
  #         Interval: 10
  #         Offset: 0
  #   Events:
  #     - ObserveNorms:
  #         SubfileName: ErrorNorm
  #         TensorsToObserve:
  #           - Name: TildePhi
  #             NormType: L2Norm
  #             Components: Sum
  #           - Name: TildePsi
  #             NormType: L2Norm
  #             Components: Sum
  #           - Name: ElectricFieldDotMagneticField
  #             NormType: L2Norm
  #             Components: Sum
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 10
          Offset: 0
    Events:
      - ObserveFields:
          SubfileName: VolumeData
          VariablesToObserve: [
              ElectricField, MagneticField,
              ChargeDensity,
              ElectricCurrentDensity,
              # Error(TildeE), Error(TildeB),
              ElectricFieldDotMagneticField,
              TildePhi, TildePsi,
              TciStatus,
            ]
          InterpolateToMesh: None
          CoordinatesFloatingPointType: Float
          FloatingPointTypes: [Float]

EventsAndDenseTriggers:
  # - Trigger:
  #     Times:
  #       Specified:
  #         Values: [0.0, 0.01, 0.02, 0.03, 0.04]
  #   Events:
  #     - ObserveFields:
  #         SubfileName: VolumeData
  #         VariablesToObserve: [
  #           ElectricField,
  #           MagneticField,
  #           Error(TildeE),
  #           Error(TildeB),
  #           ElectricFieldDotMagneticField
  #           ]
  #         InterpolateToMesh: None
  #         CoordinatesFloatingPointType: Float
  #         FloatingPointTypes: [Float]

PhaseChangeAndTriggers:
  - Trigger:
      Slabs:
        EvenlySpaced:
          # Current implementation checks wallclock at these global syncs
          Interval: 10
          Offset: 0
    PhaseChanges:
      - CheckpointAndExitAfterWallclock:
          WallclockHours: 23.5

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto

InterpolationTargets:
  TotalMagneticFluxOnUpperHemisphere:
    LMax: 3
    Radius: 2.0
    Center: [0, 0, 0]
    AngularOrdering: Strahlkorper
  PoyntingFluxOnSphere:
    LMax: 3
    Radius: 2.0
    Center: [0, 0, 0]
    AngularOrdering: Strahlkorper

