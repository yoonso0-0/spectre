Executable: EvolveForceFree
Testing:
  Check: parse;execute

---

InitialData: &InitialData
  FastWave:

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.0005
  TimeStepper:
    Rk3PareschiSsp4
  ImexMode: Implicit
  ImexImplicitSolveTolerance: 1.0e-10

Observers:
  VolumeFileName: "ForceFreeFastWaveVolume"
  ReductionFileName: "ForceFreeFastWaveReductions"

EvolutionSystem:
  ForceFree:
    ConstraintDamping:
      KappaPsi: 1.0
      KappaPhi: 1.0
    ForceFreeCurrent:
      ParallelConductivity: 1e4

DomainCreator:
  Brick:
    LowerBound: [-0.5, -0.5, -0.5]
    UpperBound: [1.5, 0.5, 0.5]
    InitialRefinement: [4, 0, 0]
    InitialGridPoints: [6, 6, 6]
    TimeDependence: None
    BoundaryConditionInX: &Analytic
      DirichletAnalytic:
        AnalyticPrescription: *InitialData
    BoundaryConditionInY: Periodic
    BoundaryConditionInZ: Periodic

SpatialDiscretization:
  BoundaryCorrection:
    Rusanov:
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Subcell:
      RdmpDelta0: 1.0e-2
      RdmpEpsilon: 1.0e-2
      PerssonExponent: 3.0
      InitialData:
        RdmpDelta0: 1.0e-2
        RdmpEpsilon: 1.0e-2
        PerssonExponent: 3.0
      AlwaysUseSubcells: false
      SubcellToDgReconstructionMethod: DimByDim
      UseHalo: false
      OnlyDgBlocksAndGroups: None
      FiniteDifferenceDerivativeOrder: 2
    TciOptions:
      CutoffTildeQ: 1.0e-3
      CutoffTildeJ: 1.0e-3
      CutoffHeating: 1.0e-3
  SubcellSolver:
    Reconstructor:
      # MonotonisedCentral
      Wcns5z:
        NonlinearWeightExponent: 2
        Epsilon: 1e-15
        FallbackReconstructor: None
        MaxNumberOfExtrema: 2

EventsAndTriggers:
  - Trigger:
      TimeCompares:
        Comparison: GreaterThanOrEqualTo
        Value: 0.10 # upto t = 0.5
    Events:
      - Completion
  - Trigger:
      Slabs:
        Specified:
          Values: [0]
    Events:
      - ChangeSlabSize:
          DelayChange: 0
          StepChoosers:
            - Cfl:
                SafetyFactor: 0.3
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 10
          Offset: 0
    Events:
      - ObserveTimeStep:
          SubfileName: time_steps
          PrintTimeToTerminal: true
          ObservePerCore: false
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 10
          Offset: 0
    Events:
      - ObserveNorms:
          SubfileName: ErrorNorm
          TensorsToObserve:
            - Name: TildePhi
              NormType: L2Norm
              Components: Sum
            - Name: TildePsi
              NormType: L2Norm
              Components: Sum
            - Name: ElectricFieldDotMagneticField
              NormType: L2Norm
              Components: Sum

EventsAndDenseTriggers:
  - Trigger:
      Times:
        Specified:
          Values: [0.0, 0.01, 0.02, 0.03, 0.04]
    Events:
      - ObserveFields:
          SubfileName: VolumeData
          VariablesToObserve: [
            ElectricField,
            MagneticField,
            Error(TildeE),
            Error(TildeB),
            ElectricFieldDotMagneticField
            ]
          InterpolateToMesh: None
          CoordinatesFloatingPointType: Float
          FloatingPointTypes: [Float]

PhaseChangeAndTriggers:

ResourceInfo:
  AvoidGlobalProc0: false
