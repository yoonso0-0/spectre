Executable: EvolveForceFree
Testing:
  Check: parse;execute

---

InitialData: &InitialData
  AlfvenWave:
    WaveSpeed: 0.0

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.001
  TimeStepper:
    # Rk3Kennedy
    Rk3PareschiSsp4
  ImexMode: Implicit
  ImexImplicitSolveTolerance: 1.0e-10

Observers:
  VolumeFileName: "ForceFreeAlfvenWaveLev5Volume"
  ReductionFileName: "ForceFreeAlfvenWaveLev5Reductions"
  SurfaceFileName: "Surface"

EvolutionSystem:
  ForceFree:
    ConstraintDamping:
      KappaPsi: 1.0
      KappaPhi: 1.0
    ForceFreeCurrent:
      ParallelConductivity: 1e3

DomainCreator:
  Brick:
    # LowerBound: [-0.0625, -0.1, -0.1]
    # UpperBound: [0.0, 0.1, 0.1]
    # InitialRefinement: [0, 0, 0]
    # InitialGridPoints: [2, 2, 2]
    # LowerBound: [-0.1, -0.1, -0.1]
    # UpperBound: [0.1, 0.1, 0.1]
    # InitialRefinement: [0, 0, 0]
    # InitialGridPoints: [2, 2, 2]
    LowerBound: [-0.5, -0.1, -0.1]
    UpperBound: [0.5, 0.1, 0.1]
    InitialRefinement: [5, 0, 0]
    InitialGridPoints: [5, 5, 5]
    TimeDependence: None
    BoundaryConditionInX: Nonreflecting
      # DirichletAnalytic:
      #   AnalyticPrescription: *InitialData
    BoundaryConditionInY: Periodic
    BoundaryConditionInZ: Periodic

# Limiter:
#   Minmod:
#     Type: LambdaPiN
#     # The optimal value of the TVB constant is problem-dependent.
#     # This test uses 0 to favor robustness over accuracy.
#     TvbConstant: 10.0
#     # disable limiter for FFE runs
#     DisableForDebugging: true

SpatialDiscretization:
  BoundaryCorrection:
    Rusanov:
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Subcell:
      RdmpDelta0: 1.0e-2
      RdmpEpsilon: 1.0e-2
      PerssonExponent: 3.0
      InitialData:
        RdmpDelta0: 1.0e-2
        RdmpEpsilon: 1.0e-2
        PerssonExponent: 3.0
      AlwaysUseSubcells: False
      SubcellToDgReconstructionMethod: DimByDim
      UseHalo: false
      OnlyDgBlocksAndGroups: None
      FiniteDifferenceDerivativeOrder: 2
    TciOptions:
      AlphaEmFields: 3.5
      CutoffTildeQ: 1.0e10
      CutoffTildeJ: 1.0e10
      MonitorNormalizedJForCutoff: false
      CutoffHeating: 1.0e10
      MonitorNormalizedHeatingForCutoff: false
  SubcellSolver:
    Reconstructor:
      MonotonisedCentral
      # Wcns5z:
      #   NonlinearWeightExponent: 2
      #   Epsilon: 1e-15
      #   FallbackReconstructor: None
      #   MaxNumberOfExtrema: 0
      # AdaptiveOrder:
        # Alpha9: None
        # Alpha7: None
        # Alpha5: 4.0
        # LowOrderReconstructor: MonotonisedCentral

EventsAndTriggers:
  - Trigger:
      Slabs:
        Specified:
          Values: [200]
    Events:
      - Completion
  # - Trigger:
  #     TimeCompares:
  #       Comparison: GreaterThanOrEqualTo
  #       Value: 0.1
  #   Events:
  #     - Completion
  - Trigger:
      Slabs:
        Specified:
          Values: [0]
    Events:
      - ChangeSlabSize:
          DelayChange: 0
          StepChoosers:
            - Cfl:
                SafetyFactor: 0.3
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 10
          Offset: 0
    Events:
      - ObserveTimeStep:
          SubfileName: time_steps
          PrintTimeToTerminal: true
          ObservePerCore: false
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 5
          Offset: 0
    Events:
      - ObserveFields:
          SubfileName: VolumeData
          VariablesToObserve: [
              ElectricField, MagneticField,
              ChargeDensity,
              ElectricCurrentDensity,
              # Error(TildeE), Error(TildeB),
              ElectricFieldDotMagneticField,
              # MagneticDominanceViolation,
              # JouleHeating,
              TildePsi, TildePhi,
              TciStatus,
            ]
          InterpolateToMesh: None
          CoordinatesFloatingPointType: Float
          FloatingPointTypes: [Float]

EventsAndDenseTriggers:

PhaseChangeAndTriggers:

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto

InterpolationTargets:
  TotalMagneticFluxOnSphere:
    LMax: 30
    Radius: 2.0
    Center: [0, 0, 0]
    AngularOrdering: Strahlkorper
  PoyntingFluxOnSphere:
    LMax: 50
    Radius: 2.0
    Center: [0, 0, 0]
    AngularOrdering: Strahlkorper
