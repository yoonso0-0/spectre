Executable: EvolveForceFree
Testing:
  Check: parse;execute

---

InitialData: &InitialData
  AlfvenWave:
    WaveSpeed: 0.0

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.0122991
  TimeStepper:
    Rk3PareschiSsp4
  Imex:
    Mode: Implicit
    SolveTolerance: 1.0e-10

Observers:
  VolumeFileName: "ForceFreeAlfvenWaveLev5Volume"
  ReductionFileName: "ForceFreeAlfvenWaveLev5Reductions"
  SurfaceFileName: "Surface"

EvolutionSystem:
  ForceFree:
    ConstraintDamping:
      KappaPsi: 10.0
      KappaPhi: 1.0
    ForceFreeCurrent:
      ParallelConductivity: 1e3

Filtering:
  ExpFilter0:
    Alpha: 12
    HalfPower: 32
    Enable: false
    BlocksToFilter: All

DomainCreator:
  Brick:
    # LowerBound: [-0.0625, -0.1, -0.1]
    # UpperBound: [0.0, 0.1, 0.1]
    # InitialRefinement: [0, 0, 0]
    # InitialGridPoints: [2, 2, 2]
    # LowerBound: [-0.1, -0.1, -0.1]
    # UpperBound: [0.1, 0.1, 0.1]
    # InitialRefinement: [0, 0, 0]
    # InitialGridPoints: [2, 2, 2]
    LowerBound: [-0.5, -0.1, -0.1]
    UpperBound: [0.5, 0.1, 0.1]
    InitialRefinement: [4, 0, 0]
    InitialGridPoints: [3, 3, 3]
    TimeDependence: None
    # BoundaryConditionInX: NoIncomingPoynting
    BoundaryConditionInX:
      DirichletAnalytic:
        AnalyticPrescription: *InitialData
    BoundaryConditionInY: Periodic
    BoundaryConditionInZ: Periodic

# Limiter:
#   Minmod:
#     Type: LambdaPiN
#     # The optimal value of the TVB constant is problem-dependent.
#     # This test uses 0 to favor robustness over accuracy.
#     TvbConstant: 10.0
#     # disable limiter for FFE runs
#     DisableForDebugging: true

SpatialDiscretization:
  BoundaryCorrection:
    Rusanov:
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Subcell:
      RdmpDelta0: 1.0e-2
      RdmpEpsilon: 1.0e-2
      PerssonExponent: 4.0
      InitialData:
        RdmpDelta0: 1.0e-2
        RdmpEpsilon: 1.0e-2
        PerssonExponent: 3.0
      AlwaysUseSubcells: false
      SubcellToDgReconstructionMethod: DimByDim
      UseHalo: false
      OnlyDgBlocksAndGroups: []
      FiniteDifferenceDerivativeOrder: 2
    TciOptions:
      TildeQCutoff: DoNotCheckTildeQ
      AlphaMagE: DoNotCheckTildeE
      AlphaMagB: 4.0
      DeltaAlpha: 1.0
      NumberOfHighestModes: 2
      UseUmaxInsteadOfNorm: true
  SubcellSolver:
    Reconstructor:
      # MonotonisedCentral
      Wcns5z:
        NonlinearWeightExponent: 2
        Epsilon: 1e-15
        FallbackReconstructor: None
        MaxNumberOfExtrema: 0
      # AdaptiveOrder:
        # Alpha9: None
        # Alpha7: None
        # Alpha5: 4.0
        # LowOrderReconstructor: MonotonisedCentral

EventsAndTriggers:
  - Trigger:
      Slabs:
        Specified:
          Values: [300]
    Events:
      - Completion
  # - Trigger:
  #     TimeCompares:
  #       Comparison: GreaterThanOrEqualTo
  #       Value: 0.1
  #   Events:
  #     - Completion
  - Trigger:
      Slabs:
        Specified:
          Values: [0]
    Events:
      - ChangeSlabSize:
          DelayChange: 0
          StepChoosers:
            - Cfl:
                SafetyFactor: 0.3
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 10
          Offset: 0
    Events:
      - ObserveTimeStep:
          SubfileName: time_steps
          PrintTimeToTerminal: true
          ObservePerCore: false
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 10
          Offset: 0
    Events:
      - ObserveFields:
          SubfileName: VolumeData
          VariablesToObserve: [
              ElectricField, MagneticField,
              ChargeDensity,
              ElectricCurrentDensity,
              # Error(TildeE), Error(TildeB),
              ElectricFieldDotMagneticField,
              # MagneticDominanceViolation,
              # JouleHeating,
              TildePsi, TildePhi,
              TciStatus,
            ]
          InterpolateToMesh: None
          CoordinatesFloatingPointType: Float
          FloatingPointTypes: [Float]

EventsAndDenseTriggers:

PhaseChangeAndTriggers:

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto

InterpolationTargets:
  TotalMagneticFluxOnUpperHemisphere:
    LMax: 3
    Radius: 2.0
    Center: [0, 0, 0]
    AngularOrdering: Strahlkorper
  PoyntingFluxOnSphere:
    LMax: 3
    Radius: 2.0
    Center: [0, 0, 0]
    AngularOrdering: Strahlkorper

Parallelization:
  ElementDistribution: NumGridPoints
