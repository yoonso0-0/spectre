Executable: EvolveValenciaDivClean
Testing:
  Check: parse;execute
  Priority: High

---

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.01
  TimeStepper: Rk3HesthavenSsp

InitialData: &InitialData
  BhlAccretion:
    Velocity: 0.05
    Density: 1.0
    Pressure: 0.01
    Spin: 0.0
    AdiabaticIndex: 1.33

DomainCreator:
  Sphere:
    InnerRadius: 1.5
    OuterRadius: 15.0
    Interior:
      ExciseWithBoundaryCondition:
        DemandOutgoingCharSpeeds
        # HydroFreeOutflow
    InitialRefinement: 2
    InitialGridPoints: 3
    UseEquiangularMap: false
    EquatorialCompression: None
    RadialPartitioning: []
    RadialDistribution: Logarithmic
    WhichWedges: All
    TimeDependentMaps: None
    OuterBoundaryCondition:
      BhlAccretion:
        AnalyticPrescription: *InitialData
      # HydroFreeOutflow
      # DirichletAnalytic:
        # AnalyticPrescription: *InitialData

SpatialDiscretization:
  BoundaryCorrection:
    Rusanov:
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Subcell:
      TroubledCellIndicator:
        PerssonTci:
          Exponent: 4.0
          NumHighestModes: 1
        RdmpTci:
          Delta0: 1.0e-7
          Epsilon: 1.0e-3
        FdToDgTci:
          NumberOfStepsBetweenTciCalls: 1
          MinTciCallsAfterRollback: 1
          MinimumClearTcis: 1
        AlwaysUseSubcells: false
        UseHalo: false
        OnlyDgBlocksAndGroups: [Wedges]
      SubcellToDgReconstructionMethod: DimByDim
      FiniteDifferenceDerivativeOrder: 2
    TciOptions:
      MinimumValueOfD: 1.0e-20
      MinimumValueOfYe: 1.0e-20
      MinimumValueOfTildeTau: 1.0e-50
      MagneticFieldCutoff: DoNotCheckMagneticField
      AtmosphereDensity: 1.01e-15
      SafetyFactorForB: 1.0e-12
  SubcellSolver:
    Reconstructor:
      Wcns5zPrim:
        NonlinearWeightExponent: 2
        Epsilon: 1.0e-15
        FallbackReconstructor: MonotonisedCentral
        MaxNumberOfExtrema: 0

EquationOfState:
  FromInitialData

EvolutionSystem:
  ValenciaDivClean:
    DampingParameter: 1.0

VariableFixing:
  FixConservatives:
    Enable: false # Only needed when not using Kastaun for recovery
    CutoffD: &CutoffD 1.0e-12
    MinimumValueOfD: &MinimumD 1.0e-12
    CutoffYe: 0.0
    MinimumValueOfYe: 0.0
    SafetyFactorForB: 1.0e-12
    SafetyFactorForS: 1.0e-12
    SafetyFactorForSCutoffD: 1.0e-12
    SafetyFactorForSSlope: 0.0
    MagneticField: AssumeNonZero
  FixToAtmosphere:
    DensityOfAtmosphere: 1.0e-12
    DensityCutoff: 1.0e-12
    TransitionDensityCutoff: 1.0e-11
    MaxVelocityMagnitude: 1.0e-4

PrimitiveFromConservative:
  CutoffDForInversion: *CutoffD
  DensityWhenSkippingInversion: *MinimumD
  KastaunMaxLorentzFactor: 10.0

Observers:
  VolumeFileName: "ValenciaDivCleanBhlAccertionVolume"
  ReductionFileName: "ValenciaDivCleanBhlAccretionReductions"

EventsAndTriggers:
  - Trigger:
      Slabs:
        Specified:
          Values: [400]
    Events:
      - Completion
  - Trigger:
      Slabs:
        Specified:
          Values: [0]
    Events:
      - ChangeSlabSize:
          DelayChange: 0
          StepChoosers:
            - Cfl:
                SafetyFactor: 0.4
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 10
          Offset: 0
    Events:
      - ObserveTimeStep:
          SubfileName: time_steps
          PrintTimeToTerminal: true
          ObservePerCore: false
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 10
          Offset: 0
    Events:
      - ObserveFields:
          SubfileName: VolumeData
          VariablesToObserve: [
            RestMassDensity,
            SpatialVelocity,
            TciStatus,
            ]
          InterpolateToMesh: None
          CoordinatesFloatingPointType: Float
          FloatingPointTypes: [Float]

EventsAndDenseTriggers:

EventsRunAtCleanup:
  ObservationValue: -1000.0
  Events:
    # - ObserveFields:
    #     SubfileName: Error
    #     VariablesToObserve: [
    #       RestMassDensity,
    #       SpatialVelocity,
    #       ]
    #     InterpolateToMesh: None
    #     CoordinatesFloatingPointType: Float
    #     FloatingPointTypes: [Float]

Interpolator:
  DumpVolumeDataOnFailure: false

Parallelization:
  ElementDistribution: NumGridPoints

ResourceInfo:
  AvoidGlobalProc0: false

PhaseChangeAndTriggers:
