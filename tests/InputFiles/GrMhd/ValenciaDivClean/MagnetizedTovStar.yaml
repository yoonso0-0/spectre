# Executable: EvolveValenciaDivCleanFishboneMoncriefDisk
# Check: parse;execute

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.1
  TimeStepper:
    RungeKutta3:

PhaseChangeAndTriggers:
  - - Slabs:
        EvenlySpaced:
          Interval: 20000
          Offset: 0
    - - VisitAndReturn(WriteCheckpoint)

DomainCreator:
  AlignedLattice:
    BlockBounds:
      [
        [-12.0, -4.0, 4.0, 12.0],
        [-12.0, -4.0, 4.0, 12.0],
        [-12.0, -4.0, 4.0, 12.0],
      ]
    InitialGridPoints: [6, 6, 6]
    InitialLevels: [1, 1, 1]
    RefinedLevels: []
    RefinedGridPoints: []
    BlocksToExclude: []
    BoundaryCondition: HydroFreeOutflow

SpatialDiscretization:
  BoundaryCorrection:
    Hll:
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Subcell:
      RdmpDelta0: 1.0e-4
      RdmpEpsilon: 1.0e-3
      PerssonExponent: 4.0
      InitialData:
        RdmpDelta0: 1.0e-4
        RdmpEpsilon: 1.0e-3
        PerssonExponent: 4.0
      AlwaysUseSubcells: false
      SubcellToDgReconstructionMethod: DimByDim
    TciOptions:
      MinimumValueOfD: 1.0e-20
      MinimumValueOfYe: 1.0e-20
      MinimumValueOfTildeTau: 1.0e-40
      MagneticFieldCutoff: DoNotCheckMagneticField
      AtmosphereDensity: 1.01e-15
      SafetyFactorForB: 1.0e-12
  SubcellSolver:
    Reconstructor:
      # PositivityPreservingAdaptiveOrderPrim:
      #   Alpha5: 4.0
      #   Alpha7: None
      #   Alpha9: None
      #   LowOrderReconstructor: MonotonisedCentral
      MonotonisedCentralPrim:

AnalyticData:
  MagnetizedTovStar:
    CentralDensity: 1.28e-3
    EquationOfState:
      PolytropicFluid:
        PolytropicConstant: 100.0
        PolytropicExponent: 2.0
    Coordinates: Isotropic
    PoloidalField:
      PressureExponent: 2
      VectorPotentialAmplitude: 20.0
      CutoffPressureFraction: 0.03
    ToroidalField:
      PressureExponent: 2
      VectorPotentialAmplitude: 1400.0
      CutoffPressureFraction: 0.03

EvolutionSystem:
  ValenciaDivClean:
    DampingParameter: 1.0

VariableFixing:
  FixConservatives:
    CutoffD: 1.01e-15
    MinimumValueOfD: 1.0e-15
    CutoffYe: 1.0e-10
    MinimumValueOfYe: 1.0e-10
    SafetyFactorForB: 1.0e-12
    SafetyFactorForS: 1.0e-12
  FixToAtmosphere:
    DensityOfAtmosphere: 1.0e-15
    DensityCutoff: 1.01e-15
    TransitionDensityCutoff: 1.0e-14
    MaxVelocityMagnitude: 1.0e-4

Observers:
  VolumeFileName: "MagnetizedTovStarLev2"
  ReductionFileName: "MagnetizedTovStarLev2"

EventsAndTriggers:
  # - - Slabs:
  #       EvenlySpaced:
  #         Interval: 1000
  #         Offset: 0
  #   - - ObserveFields:
  #         VariablesToObserve: [
  #             RestMassDensity,
  #             SpatialVelocity,
  #             MagneticField,
  #             DivergenceCleaningField,
  #             TciStatus,
  #             # TildeD, TildeTau, Pressure
  #           ]
  #         SubfileName: element_data
  #         InterpolateToMesh: None
  #         CoordinatesFloatingPointType: Float
  #         FloatingPointTypes: [Float]
  # - - Slabs:
  #       EvenlySpaced:
  #         Interval: 1000
  #         Offset: 0
  #   - - ObserveTimeStep:
  #         SubfileName: time_steps
  #         PrintTimeToTerminal: true
  #         ObservePerCore: false
  - - Slabs:
        EvenlySpaced:
          Interval: 1000
          Offset: 0
    - - ObserveNorms:
          SubfileName: max_data
          TensorsToObserve:
            - Name: ComovingMagneticFieldMagnitude
              NormType: Max
              Components: Individual
  - - Slabs:
        Specified:
          # 400K slabs with a dt of 0.1 means final time of (40k)M_sun = 200ms
          Values: [1]
    - - Completion

EventsAndDenseTriggers:

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons:
    CenterOfStar:
      Proc: Auto
      Exclusive: false

InterpolationTargets:
  CenterOfStar:
    Points: [[0.0, 0.0, 0.0]]

Interpolator:
  DumpVolumeDataOnFailure: false
