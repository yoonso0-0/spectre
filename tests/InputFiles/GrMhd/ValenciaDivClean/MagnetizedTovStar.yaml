# Executable: EvolveValenciaDivCleanBlastWave
# Check: parse;execute

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.1
  TimeStepper:
    RungeKutta3:

PhaseChangeAndTriggers:
  - - Slabs:
        EvenlySpaced:
          Interval: 40000
          Offset: 0
    - - VisitAndReturn(WriteCheckpoint)

DomainCreator:
  AlignedLattice:
    BlockBounds:
      [
        [-20.0, -6.666666666666666, 6.666666666666666, 20.0],
        [-20.0, -6.666666666666666, 6.666666666666666, 20.0],
        [-20.0, -6.666666666666666, 6.666666666666666, 20.0],
      ]
    InitialGridPoints: [6, 6, 6]
    InitialLevels: [1, 1, 1]
    RefinedLevels: []
    RefinedGridPoints: []
    BlocksToExclude: []
    BoundaryCondition: FreeOutflow

SpatialDiscretization:
  BoundaryCorrection:
    Hll:
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Subcell:
      RdmpDelta0: 1.0e-7
      RdmpEpsilon: 1.0e-3
      PerssonExponent: 4.0
      InitialData:
        RdmpDelta0: 1.0e-7
        RdmpEpsilon: 1.0e-3
        PerssonExponent: 4.0
      AlwaysUseSubcells: false
      SubcellToDgReconstructionMethod: DimByDim
    TciOptions:
      MinimumValueOfD: 1.0e-20
      MinimumValueOfTildeTau: 1.0e-40
      MagneticFieldCutoff: DoNotCheckMagneticField
      AtmosphereDensity: 1.01e-15 # change to 1.0 ?
      SafetyFactorForB: 1.0e-12
  SubcellSolver:
    Reconstructor:
      MonotonisedCentralPrim:

AnalyticData:
  MagnetizedTovStar:
    CentralDensity: 1.28e-3
    EquationOfState:
      PolytropicFluid:
        PolytropicConstant: 100.0
        PolytropicExponent: 2.0
    Coordinates: Isotropic
    PressureExponent: 2
    # 2500 gives a magnetic field strength of ~10^{16}G
    VectorPotentialAmplitude: 2500
    CutoffPressureFraction: 0.04

EvolutionSystem:
  ValenciaDivClean:
    DampingParameter: 1.0

VariableFixing:
  FixConservatives:
    CutoffD: 1.01e-15
    MinimumValueOfD: 1.0e-15
    SafetyFactorForB: 1.0e-12
    SafetyFactorForS: 1.0e-12
  FixToAtmosphere:
    DensityOfAtmosphere: 1.0e-15
    DensityCutoff: 1.01e-15
    TransitionDensityCutoff: 1.0e-14
    MaxVelocityMagnitude: 1.0e-4

Observers:
  VolumeFileName: "MagnetizedTovStarLev1Outflow"
  ReductionFileName: "MagnetizedTovStarLev1Outflow"

EventsAndTriggers:
  # ? Slabs:
  #     EvenlySpaced:
  #       Interval: 4000
  #       Offset: 0
  # : - ObserveFields:
  #       VariablesToObserve: [RestMassDensity, SpatialVelocity,
  #                            MagneticField, DivergenceCleaningField,
  #                            TciStatus,
  #                           #  TildeD, TildeTau
  #                            # , Lapse
  #                            # , dt(TildeD), dt(TildeTau), dt(TildeS)
  #                            ]
  #       SubfileName: element_data
  #       InterpolateToMesh: None
  #       CoordinatesFloatingPointType: Float
  #       FloatingPointTypes: [Float]
  ? Slabs:
      EvenlySpaced:
        Interval: 1
        Offset: 0
  : - ObserveTimeStep:
        SubfileName: time_steps
        PrintTimeToTerminal: true
        ObservePerCore: false
  # ? Slabs:
  #     EvenlySpaced:
  #       Interval: 400
  #       Offset: 0
  # : - ObserveNorms:
  #       SubfileName: max_data
  #       TensorsToObserve:
  #         - Name: RestMassDensity
  #           NormType: Max
  #           Components: Individual
  ? Slabs:
      Specified:
        # 100K slabs with a dt of 0.1 means final time of (10k)M, which with
        # M=M_sun means we have a final time of 50ms
        Values: [10]
  : - Completion

EventsAndDenseTriggers:

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons:
    CenterOfStar:
      Proc: Auto
      Exclusive: false

InterpolationTargets:
  CenterOfStar:
    Points: [[0.0, 0.0, 0.0]]
